env:
  browser: true
  es2022: true

parserOptions:
  ecmaVersion: "latest"
  sourceType: module

overrides:
  - files:
      - "**/*.js"
    parserOptions:
      sourceType: module

globals:
  odoo: readonly
  owl: readonly
  luxon: readonly
  _: readonly
  $: readonly
  jQuery: readonly

extends:
  - eslint:recommended

rules:
  accessor-pairs: warn
  array-callback-return: warn
  complexity:
    - warn
    - 15
  constructor-super: error
  dot-notation: warn
  eqeqeq: warn
  no-alert: warn
  no-array-constructor: warn
  no-case-declarations: warn
  no-class-assign: error
  no-cond-assign: error
  no-console: warn
  no-const-assign: error
  no-constant-condition: warn
  no-debugger: error
  no-delete-var: error
  no-dupe-args: error
  no-dupe-class-members: error
  no-dupe-keys: error
  no-duplicate-case: error
  no-duplicate-imports: error
  no-empty: warn
  no-empty-function: warn
  no-empty-pattern: error
  no-eq-null: error
  no-eval: error
  no-ex-assign: error
  no-extra-bind: warn
  no-extra-boolean-cast: warn
  no-fallthrough: warn
  no-func-assign: error
  no-global-assign: error
  no-implied-eval: warn
  no-invalid-regexp: error
  no-irregular-whitespace: error
  no-lonely-if: warn
  no-new: warn
  no-new-func: warn
  no-new-object: warn
  no-obj-calls: error
  no-octal: error
  no-param-reassign: warn
  no-prototype-builtins: warn
  no-redeclare: error
  no-regex-spaces: error
  no-return-assign: error
  no-self-assign: error
  no-shadow: warn
  no-sparse-arrays: error
  no-this-before-super: error
  no-throw-literal: warn
  no-undef: error
  no-unreachable: error
  no-unused-expressions: error
  no-unused-labels: error
  no-unused-vars:
    - error
    - argsIgnorePattern: "^_"
      varsIgnorePattern: "^_"
  no-use-before-define: error
  no-useless-call: warn
  no-useless-concat: warn
  no-useless-constructor: warn
  no-useless-escape: warn
  no-with: error
  prefer-const: warn
  radix: warn
  require-yield: warn
  sort-imports: off
  spaced-comment:
    - error
    - always
  use-isnan: error
  valid-typeof: error
  yoda: warn
